<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionmedicament</title>
    <link rel="stylesheet" th:href="@{/ressources/css/ServiceAchat.css}">
</head>
<body>
    <main class="sidebar">
        <h1>
            <i class="fas fa-clinic-medical"></i> SAINT SCOTT
        </h1>

        <div>
            <ul>
                <li><a href="/ProjetPharmacie/Accueil"><i class="fas fa-home"></i> ACCUEIL</a></li>
                <li><a href="/ProjetPharmacie/Fournisseur"><i class="fas fa-truck"></i> Fournisseurs</a></li>
                <li><a href="/ProjetPharmacie/Medicament"><i class="fas fa-pills"></i> Médicaments</a></li>
                <li><a href="/ProjetPharmacie/LigneAchat"><i class="fas fa-list"></i> Lignes d'achat</a></li>
                <li><a href="/ProjetPharmacie/ServiceAchat" class="active"><i class="fas fa-warehouse"></i> Services d'achat</a></li>
            </ul>
        </div>

        <!-- Barre de recherche -->
        <div class="topbar">
            <i class="fas fa-search"></i>
            <input type="text" class="chang" placeholder="Rechercher..." />
        </div>

        <!-- Formulaire -->
        <div class="forme">
            <h2 id="info">Informations sur le service d'achat</h2><br>
            <form action="/ProjetPharmacie/ServiceAchat" method="post">

                <label for="nom_client">Nom du client</label>
                <input type="text" id="nom_client" name="nom_client" required><br><br>

                <label for="quantite">Quantité</label>
                <input type="number" id="quantite" name="quantite" required><br><br>

                <label for="prix_total">Prix total</label>
                <input type="number" id="prix_total" name="prix_total" required><br><br>

                <label for="etat">État</label>
                <input type="text" id="etat" name="etat" required><br><br>

                <button type="submit" name="action" value="enregistrer">Enregistrer</button>
                 <a href="/ProjetPharmacie/ListeServiceAchat" class="button">AfficheListe</a>
            </form>
        </div>

        <!-- Tableau -->
        <table class="tablo">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom du client</th>
                    <th>Quantité</th>
                    <th>Prix total</th>
                    <th>État</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="achat : ${listeServiceAchat}">
                    <td th:text="${achat.id}">ID</td>
                    <td th:text="${achat.nomClient}">nom_client</td>
                    <td th:text="${achat.quantite}">quantite</td>
                    <td th:text="${achat.prixTotal}">prix_total</td>
                    <td th:text="${achat.etat}">etat</td>
                    <td>
        <!-- Icône Modifier -->
        <i class="fas fa-edit" style="color:#4caf50; cursor:pointer; margin-right:10px;" title="Modifier"
           th:attr="onclick='executerAction(\'modifier\')'"></i>

        <!-- Icône Supprimer -->
        <i class="fas fa-trash-alt" style="color:#f44336; cursor:pointer;" title="Supprimer"
           th:attr="onclick='executerAction(\'supprimer\')'"></i>
    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
