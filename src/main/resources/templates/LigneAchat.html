<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionmedicament</title>
    <link rel="stylesheet" th:href="@{/ressources/css/LigneAchat.css}">
</head>
<body>
    <main class="sidebar">
        <h1>
            <i class="fas fa-clinic-medical"></i> SAINT SCOTT
        </h1>

        <div>
            <ul>
               <li><a href="/ProjetPharmacie/Accueil" ><i class="fas fa-home"></i> ACCUEIL</a></li>
               <li><a href="/ProjetPharmacie/Fournisseur" ><i class="fas fa-truck"></i> Fournisseurs</a></li>
               <li><a href="/ProjetPharmacie/Medicament"><i class="fas fa-pills"></i>Médicaments</a></li>
               <li><a href="/ProjetPharmacie/LigneAchat" class="active"><i class="fas fa-list"></i> Lignes d'achat</a></li>
               <li><a href="/ProjetPharmacie/ServiceAchat"> <i class="fas fa-warehouse"></i>Services d'achat</a></li>
            </ul>
        </div>
<!--contenu principal-->

        <div class="topbar">
          <i class="fas fa-search"></i>
          <input type="text"  class="chang" placeholder="Rechercher..." />
        </div>

                 <div class="forme">
            <h2 id="info">Informations sur les lignes d'achat</h2><br>
            <form action="/ProjetPharmacie/LigneAchat"  method="post">

                <label for="code">Code</label>
                <input type="number" id="code" name="code" required> <br><br>

                <label for="reference">Référence</label>
                <input type="text" id="reference" name="reference" required> <br><br>

                <label for="quantite">Quantité</label>
                <input type="number" id="quantite" name="quantite" required> <br><br>

                <label for="prix_unitaire">Prix_unitaire</label>
                <input type="number" id="prix_unitaire" name="prix_unitaire" required> <br><br>

                <label for="montant">Montant</label>
                <input type="number" id="montant" name="montant" required> <br><br>

            <button type="submit" name="action" value="enregistrer">Enregistrer</button>
             <a href="/ProjetPharmacie/ListeLigneAchat" class="button">AfficheListe</a>

            </form>
        </div>

        <table class="tablo">
    <thead>
        <tr>
            <th>Code</th>
            <th>Référence</th>
            <th>Quantité</th>
            <th>Prix_unitaire</th>
            <th>Montant</th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="ligne : ${listeLigneAchat}">
        <td th:text="${ligne.code}">Code</td>
        <td th:text="${ligne.reference}">Réference</td>
        <td th:text="${ligne.quantite}">Quantité</td>
        <td th:text="${ligne.prix_unitaire}">prix_unitaire</td>
        <td th:text="${ligne.montant}">Montant</td>
        <td>
        <!-- Icône Modifier -->
        <i class="fas fa-edit" style="color:#4caf50; cursor:pointer; margin-right:10px;" title="Modifier"
           th:attr="onclick='executerAction(\'modifier\')'"></i>

        <!-- Icône Supprimer -->
        <i class="fas fa-trash-alt" style="color:#f44336; cursor:pointer;" title="Supprimer"
           th:attr="onclick='executerAction(\'supprimer\')'"></i>
    </td>
    </tr>
</tbody>

</table>
</main>

</body>
</html>
