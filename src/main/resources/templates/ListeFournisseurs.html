<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Fournisseurs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .btn-retour {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn-retour:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-truck"></i> Liste des Fournisseurs</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Adresse</th>
                <th>Téléphone</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="f : ${listeFournisseurs}">
                <td th:text="${f.id}">1</td>
                <td th:text="${f.nom_fournisseur}">Nom</td>
                <td th:text="${f.prenom_fournisseur}">Prénom</td>
                <td th:text="${f.adresse}">Adresse</td>
                <td th:text="${f.telephone}">Téléphone</td>
                <td th:text="${f.email}">Email</td>
                <td > 
                    <form th:action="@{/ListeFournisseurs}" method="post">
                        <button type="submit" name="action" value="modifier">
                            <i class="fas fa-edit"></i> modifier
                        </button>
                        <button type="submit" name="action" value="supprimer" class="btn-supprimer">
                            <i class="fas fa-trash"></i> Supprimer
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a href="/ProjetPharmacie/Fournisseur" class="btn-retour"><i class="fas fa-arrow-left"></i> Retour au formulaire</a>

</body>
</html>
